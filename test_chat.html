<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGPVebazaar — Chat System Automated Verification Suite</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      background: #0B0F19;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2.5rem;
      line-height: 1.5;
    }
    .test-container {
      max-width: 900px;
      margin: 0 auto;
    }
    .test-header {
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1.25rem;
      margin-bottom: 2rem;
    }
    .test-summary-card {
      background: #151C2C;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      gap: 2.5rem;
      margin-bottom: 2rem;
    }
    .metric-val {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
    }
    .metric-label {
      font-size: 0.75rem;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.35rem;
    }
    .test-card {
      background: #111726;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .test-card.passed {
      border-left: 4px solid #10B981;
    }
    .test-card.failed {
      border-left: 4px solid #EF4444;
    }
    .test-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-pass {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-fail {
      background: rgba(239, 68, 68, 0.15);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="test-container">
    <div class="test-header">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 style="font-size:1.6rem; font-weight:800; margin:0 0 0.35rem 0; color:#FFFFFF;">Chat System Verification Suite</h1>
          <p style="margin:0; font-size:0.88rem; color:#94A3B8;">Testing Flow A through J: Realtime, Optimistic UI, Deduplication, Pagination, IDOR & Error Recovery</p>
        </div>
        <button id="btn-run-all" class="btn btn-primary" onclick="runChatTestSuite()">Run All Tests ⚡</button>
      </div>
    </div>

    <div class="test-summary-card">
      <div>
        <div class="metric-val" id="pass-count" style="color:#10B981;">0</div>
        <div class="metric-label">Tests Passed</div>
      </div>
      <div>
        <div class="metric-val" id="fail-count" style="color:#EF4444;">0</div>
        <div class="metric-label">Tests Failed</div>
      </div>
      <div>
        <div class="metric-val" id="total-count" style="color:#60A5FA;">10</div>
        <div class="metric-label">Target Scenarios</div>
      </div>
      <div>
        <div class="metric-val" id="status-val" style="color:#F59E0B; font-size:1.4rem; padding-top:0.4rem;">READY</div>
        <div class="metric-label">Execution Status</div>
      </div>
    </div>

    <div id="test-results-container">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/roster.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/store.js"></script>

  <script>
    async function runChatTestSuite() {
      const container = document.getElementById('test-results-container');
      container.innerHTML = '<div style="padding:2rem; text-align:center; color:#94a3b8;">Running tests...</div>';
      document.getElementById('status-val').textContent = 'RUNNING';
      document.getElementById('status-val').style.color = '#F59E0B';

      const results = [];
      const store = window.Store;
      const userA = { id: 'user-alice-101', name: 'Alice', enrollment: '0101CS261010' };
      const userB = { id: 'user-bob-202', name: 'Bob', enrollment: '0101IT261020' };

      // Ensure test conversation exists
      const testConvId = 'conv-test-automated-' + Date.now();
      store.state.conversations.unshift({
        id: testConvId,
        partnerId: userB.id,
        partnerName: userB.name,
        partnerProgram: 'B.Tech IT · 2026',
        listingTitle: 'Engineering Drafter Kit',
        listingPrice: 350,
        participants: [userA.id, userB.id, 'user-current'],
        unreadCount: 0,
        messages: []
      });

      // -----------------------------------------------------------------------
      // TEST A: Optimistic send & server reconciliation
      // -----------------------------------------------------------------------
      try {
        const sendRes = store.sendMessage(testConvId, 'Hello Bob! Is this available?', userA, {
          clientMessageId: 'cmsg-a-' + Date.now(),
          offlineOnly: true
        });
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const lastMsg = conv.messages[conv.messages.length - 1];
        const passed = sendRes.success && lastMsg && lastMsg.text === 'Hello Bob! Is this available?' && lastMsg.sender === 'mine';
        results.push({
          id: 'A',
          name: 'Optimistic UI Instant Send',
          passed: Boolean(passed),
          detail: passed ? 'Message appeared immediately in state with sender context and timestamp' : 'Failed to create optimistic message'
        });
      } catch (e) {
        results.push({ id: 'A', name: 'Optimistic UI Instant Send', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST B: Realtime message receipt without refresh
      // -----------------------------------------------------------------------
      try {
        const replyPayload = {
          id: 'msg-reply-' + Date.now(),
          conversation_id: testConvId,
          sender_id: userB.id,
          content: 'Yes Alice, still available! Can meet at library.',
          status: 'delivered',
          created_at: new Date().toISOString()
        };
        store.addRealtimeMessage(testConvId, replyPayload, userA.id);
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const received = conv.messages.find(m => m.id === replyPayload.id);
        const passed = Boolean(received && received.sender === 'theirs' && received.text.includes('still available'));
        results.push({
          id: 'B',
          name: 'Immediate Message Receipt (No refresh)',
          passed,
          detail: passed ? 'Recipient message smoothly integrated into active conversation state' : 'Realtime message missing'
        });
      } catch (e) {
        results.push({ id: 'B', name: 'Immediate Message Receipt', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST C: Rapid 10 messages order & deduplication
      // -----------------------------------------------------------------------
      try {
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const startLen = conv.messages.length;
        for (let i = 1; i <= 10; i++) {
          store.sendMessage(testConvId, `Rapid fire message ${i}`, userA, {
            clientMessageId: `cmsg-rapid-${i}`,
            offlineOnly: true
          });
        }
        // Attempt duplicate insertion
        store.sendMessage(testConvId, `Rapid fire message 1`, userA, {
          clientMessageId: `cmsg-rapid-1`,
          offlineOnly: true
        });

        const newLen = conv.messages.length;
        const passed = (newLen === startLen + 10);
        results.push({
          id: 'C',
          name: '10 Rapid Messages Ordered & Deduplicated',
          passed,
          detail: passed ? 'All 10 messages inserted exactly once; duplicate clientMessageId safely rejected' : `Expected ${startLen + 10} messages, found ${newLen}`
        });
      } catch (e) {
        results.push({ id: 'C', name: 'Rapid Messages Test', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST D: Network failure resilience & FAILED / RETRY state
      // -----------------------------------------------------------------------
      try {
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const failClientMsgId = 'cmsg-fail-' + Date.now();
        // Insert message simulating network failure
        conv.messages.push({
          id: failClientMsgId,
          clientMessageId: failClientMsgId,
          conversation_id: testConvId,
          sender: 'mine',
          sender_id: userA.id,
          text: 'Message during elevator disconnect',
          status: 'failed',
          time: 'Just now'
        });
        const failedMsg = conv.messages.find(m => m.clientMessageId === failClientMsgId);
        const passed = Boolean(failedMsg && failedMsg.status === 'failed');
        results.push({
          id: 'D',
          name: 'Network Failure Handling (FAILED state)',
          passed,
          detail: passed ? 'Failed message properly flagged with FAILED status and retry capability' : 'Failed status not recorded'
        });
      } catch (e) {
        results.push({ id: 'D', name: 'Network Failure Handling', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST E: Retry message without duplicates
      // -----------------------------------------------------------------------
      try {
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const target = conv.messages.find(m => m.status === 'failed');
        if (target) {
          store.retryFailedMessage(testConvId, target.clientMessageId, userA);
          // Wait for retry completion
          await new Promise(r => setTimeout(r, 600));
        }
        const retried = conv.messages.find(m => m.clientMessageId === target?.clientMessageId);
        const passed = Boolean(retried && (retried.status === 'sent' || retried.status === 'sending'));
        results.push({
          id: 'E',
          name: 'Retry Recovered Message Without Duplicates',
          passed,
          detail: passed ? 'Message successfully transitioned from failed to sent with single instance retained' : 'Retry did not update state'
        });
      } catch (e) {
        results.push({ id: 'E', name: 'Retry Message Test', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST F: Singleton channel subscription & cleanup
      // -----------------------------------------------------------------------
      try {
        const sub1 = window.SupaChat.subscribeToConversation('c0000000-0000-0000-0000-000000000001');
        const active1 = window.SupaChat.activeChatChannel;
        const sub2 = window.SupaChat.subscribeToConversation('c0000000-0000-0000-0000-000000000002');
        const active2 = window.SupaChat.activeChatChannel;
        window.SupaChat.unsubscribeChatChannel();
        const activeAfterClean = window.SupaChat.activeChatChannel;

        const passed = Boolean(active1 && active2 && activeAfterClean === null);
        results.push({
          id: 'F',
          name: 'Realtime Listener Teardown & Leak Prevention',
          passed,
          detail: passed ? 'Previous channel torn down before new subscription; clean unmount verified' : 'Channel leak detected'
        });
      } catch (e) {
        results.push({ id: 'F', name: 'Realtime Listener Teardown', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST G: Pagination with cursor
      // -----------------------------------------------------------------------
      try {
        const pagRes = await window.SupaChat.fetchMessages('c0000000-0000-0000-0000-000000000001', { limit: 2 });
        const passed = Boolean(pagRes.success && pagRes.data.length > 0 && pagRes.nextCursor);
        results.push({
          id: 'G',
          name: 'Cursor-Based Message Pagination',
          passed,
          detail: passed ? `Retrieved ${pagRes.data.length} messages with cursor ${pagRes.nextCursor}` : 'Pagination failed'
        });
      } catch (e) {
        results.push({ id: 'G', name: 'Message Pagination', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST H: IDOR unauthorized conversation access (403/Access Denied)
      // -----------------------------------------------------------------------
      try {
        const attacker = { id: 'user-malicious', isVerified: true, enrollment: '0101CS269999' };
        const idorRes = store.getConversation(testConvId, attacker);
        const passed = (idorRes.success === false && idorRes.error.includes('Access Denied'));
        results.push({
          id: 'H',
          name: 'IDOR Security Barrier (403 Access Denied)',
          passed,
          detail: passed ? 'Unauthorized student strictly blocked from accessing private peer thread' : 'Vulnerability: IDOR permitted'
        });
      } catch (e) {
        results.push({ id: 'H', name: 'IDOR Security Barrier', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST I: Background message arrival & unread badge count
      // -----------------------------------------------------------------------
      try {
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const initialUnread = conv.unreadCount || 0;
        store.addRealtimeMessage(testConvId, {
          id: 'msg-bg-' + Date.now(),
          conversation_id: testConvId,
          sender_id: userB.id,
          content: 'Unread background notification test',
          created_at: new Date().toISOString()
        }, userA.id);

        const newUnread = conv.unreadCount;
        const totalUnread = store.getTotalUnreadChatCount();
        const passed = (newUnread === initialUnread + 1) && (totalUnread > 0);
        results.push({
          id: 'I',
          name: 'Background Message & Unread Counter',
          passed,
          detail: passed ? `Unread count correctly incremented to ${newUnread}, total unread badges synced` : 'Unread counter not incremented'
        });
      } catch (e) {
        results.push({ id: 'I', name: 'Background Message & Unread Counter', passed: false, detail: e.message });
      }

      // -----------------------------------------------------------------------
      // TEST J: Open unread conversation -> marked as read
      // -----------------------------------------------------------------------
      try {
        store.markConversationAsRead(testConvId, userA);
        const conv = store.state.conversations.find(c => c.id === testConvId);
        const passed = (conv.unreadCount === 0);
        results.push({
          id: 'J',
          name: 'Read Status Synchronization (Zero Unread)',
          passed,
          detail: passed ? 'Conversation marked as read; unread count set to 0 and message read status synced' : 'Unread count not reset'
        });
      } catch (e) {
        results.push({ id: 'J', name: 'Read Status Synchronization', passed: false, detail: e.message });
      }

      // Render summary & cards
      const passes = results.filter(r => r.passed).length;
      const fails = results.filter(r => !r.passed).length;

      document.getElementById('pass-count').textContent = passes;
      document.getElementById('fail-count').textContent = fails;
      document.getElementById('status-val').textContent = fails === 0 ? 'ALL PASSED' : 'SOME FAILED';
      document.getElementById('status-val').style.color = fails === 0 ? '#10B981' : '#EF4444';

      container.innerHTML = results.map(r => `
        <div class="test-card ${r.passed ? 'passed' : 'failed'}">
          <div style="display:flex; align-items:center; gap:1rem;">
            <div style="font-weight:800; font-size:1.1rem; color:${r.passed ? '#34D399' : '#F87171'}; width:28px;">${r.id}</div>
            <div>
              <div style="font-weight:700; font-size:0.95rem; color:#FFFFFF;">${r.name}</div>
              <div style="font-size:0.8rem; color:#94A3B8; margin-top:0.15rem;">${r.detail}</div>
            </div>
          </div>
          <span class="test-badge ${r.passed ? 'badge-pass' : 'badge-fail'}">
            ${r.passed ? 'PASS ✓' : 'FAIL ✕'}
          </span>
        </div>
      `).join('');

      // Expose to window for headless testing
      window.__CHAT_TEST_RESULTS = {
        passes,
        fails,
        total: results.length,
        results
      };
    }

    window.addEventListener('DOMContentLoaded', runChatTestSuite);
  </script>
</body>
</html>
